name: sensor-ingestion

# Environment variables for every PHP container.
# Values come from the .env file in this folder.
x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-SensorIngestionSystem}
  APP_ENV: ${APP_ENV:-local}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8081}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  GATEWAY_TOKEN: ${GATEWAY_TOKEN}
  INGRESS_MAX_FUTURE_SECONDS: ${INGRESS_MAX_FUTURE_SECONDS:-300}

  DB_CONNECTION: mariadb
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

  # We use Redis for cache. We do not use Laravel queues or sessions.
  CACHE_STORE: redis
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync

# Same image and settings for the app and the workers.
x-php-service: &php-service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  image: sensor-ingestion-php
  environment: *app-environment
  volumes:
    - ./src:/var/www/html
  networks:
    - backend

services:
  # Web server. This is the only service open to the network.
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/public:/var/www/html/public:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

  # PHP-FPM: runs the Laravel API.
  app:
    <<: *php-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # The API publishes to the exchange, so the exchange must exist first.
      rabbitmq-setup:
        condition: service_completed_successfully

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  # Web page to browse the database. Only from own machine.
  # Log in with DB_USERNAME and DB_PASSWORD (or root and DB_ROOT_PASSWORD).
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      # Management page, only from own machine.
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # Runs once: creates the RabbitMQ exchange, queues and bindings.
  rabbitmq-setup:
    <<: *php-service
    restart: "no"
    command: ["php", "artisan", "rabbitmq:setup"]
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Long-running PHP processes. After changing worker code, run:
  #   docker compose restart state-worker telemetry-worker
  state-worker:
    <<: *php-service
    restart: unless-stopped
    command: ["php", "artisan", "consume:state"]
    # The PHP-FPM image stops with SIGQUIT, but the workers handle SIGTERM.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on:
      rabbitmq-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  telemetry-worker:
    <<: *php-service
    restart: unless-stopped
    command: ["php", "artisan", "consume:telemetry"]
    # The PHP-FPM image stops with SIGQUIT, but the workers handle SIGTERM.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on:
      rabbitmq-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  backend:

volumes:
  db_data:
  redis_data:
  rabbitmq_data: