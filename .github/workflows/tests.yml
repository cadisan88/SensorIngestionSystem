name: Tests

on:
  push:
    branches: [master]
  pull_request:

# This workflow only reads the code.
permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Check the OpenAPI file
        run: docker run --rm -e REDOCLY_TELEMETRY=off -v "$PWD":/spec redocly/cli:1.34.5 lint openapi.yaml

      # .env.example only has placeholder values, so no secrets are needed.
      # The container user must match the runner user to write to src/vendor.
      - name: Prepare the settings
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build the PHP image
        run: docker compose build app

      - name: Install PHP packages
        run: docker compose run --rm --no-deps app composer install --no-interaction --no-progress

      # The tests use SQLite in memory, so only Redis is needed.
      - name: Start Redis
        run: docker compose up -d --wait redis

      - name: Run the tests
        run: docker compose run --rm --no-deps app vendor/bin/phpunit
